<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCR Tamil — Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
<h1>OCR Tamil — Demo</h1>
<p class="text-muted">Upload an image containing Tamil or English text.</p>


{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}


<form method="post" enctype="multipart/form-data">
<div class="mb-3">
<input class="form-control" type="file" name="image" accept="image/*" required>
</div>
<button class="btn btn-primary" type="submit">Run OCR</button>
</form>


{% if result %}
<hr />
<h4>Extracted Text</h4>
<pre style="white-space: pre-wrap;">{{ result }}</pre>
<a class="btn btn-outline-secondary" href="/download/{{ filename }}">Download as .txt</a>
{% endif %}
</div>
</body>
</html>
